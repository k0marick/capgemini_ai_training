# Playwright E2E: real app, both OAuth providers pointed at the local stub (frontend/e2e/stub-providers.mjs).
spring:
  datasource:
    url: jdbc:mysql://${TEST_MYSQL_HOST:localhost}:${TEST_MYSQL_PORT:3306}/${E2E_MYSQL_DB:todo_manager_e2e}?serverTimezone=UTC
    username: ${TEST_MYSQL_USER:todo_user}
    password: ${TEST_MYSQL_PASSWORD:todo_insecure_password!1}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: e2e-google-client
            client-secret: e2e-google-secret
          github:
            client-id: e2e-github-client
            client-secret: e2e-github-secret
        provider:
          google:
            issuer-uri: http://localhost:9999
          github:
            authorization-uri: http://localhost:9999/github/authorize
            token-uri: http://localhost:9999/github/token
            user-info-uri: http://localhost:9999/github/user
notifications:
  interval-ms: 2000
